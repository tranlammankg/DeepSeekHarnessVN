# @ailamman/dsh-workspace-download — bundle patch layer.
#
# Intentionally empty.
#
# The row that activates this plugin lives in the *profile's own*
# `cordis.patch.yml` (`~/.dsh/profiles/web/cordis.patch.yml`), and it must live
# in exactly one layer: the Cordis loader rejects a duplicate loader-entry id
# across layers ("duplicate loader entry id: ui-workspace-download"), and the
# profile patch file is the layer watched live (`patchReload: live`) — which is
# what lets the plugin appear in an already-running `dsh web` with only a page
# refresh, no server restart.
#
# The package still declares `dsh.bundle.patch`, so `dsh plugin add` tracks it
# as a profile bundle and keeps `dsh.profile.bundles` in sync.
